plugins {
    id 'fabric-loom' version '1.1-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.4'
    mappings 'net.fabricmc:yarn:1.20.4+build.1:v2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.89.0+1.20.4'
}

loom {
    refreshVersions = true
    refreshDeps = true
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'fabric.mod.json'
        expand 'fabric.mod.json': 'fabric.mod.json'
    }
}
